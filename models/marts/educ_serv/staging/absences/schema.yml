version: 2

models:
  - name: cdpvd_stg_dim_absences_inclusion
    tags: ["absenteeism"]
    description: >
      Table auxiliaire sélectionnant les raisons d'absences et de retards que vous souhaitez inclure dans le calcul.
    tests:
      - core_dashboards_store.resolution:
          combination_of_columns:
            - id_eco
            - motif_abs
    columns:
      - name: category_abs
        tests:
          - not_null
  - name: cdpvd_stg_absence_daily_grid
    tags: ["absenteeism"]
    description: >
        Table intermédiaire technique utilisée pour optimiser le calcul des indicateurs d'absentéisme quotidiens.
  - name: cdpvd_stg_absence_daily_base
    tags: ["absenteeism"]
    description: >
        Table intermédiaire technique utilisée pour optimiser le calcul des indicateurs d'absentéisme quotidiens.        
  - name: cdpvd_stg_absence_daily
    tags: ["absenteeism"]
    description: >
      Table auxiliaire calculant le nombre agrégé d'absences et de retards par jour, pour chaque étudiant ayant au MOINS une absence pour une période donnée.
    tests:
      - core_dashboards_store.resolution:
          combination_of_columns:
            - fiche
            - date_abs
            - id_eco
            - event_kind
            - category_abs
            - code_matiere

